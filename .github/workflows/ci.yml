name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On a v* tag, the package that gets pushed is whatever <Version> says —
      # the tag name is never fed into the build. Fail here if they disagree,
      # so a v1.6.3 tag can't quietly publish 1.6.2. Runs in build, not
      # publish, because publish has no checkout and so no .csproj to read.
      - name: Verify tag matches <Version>
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' YulsnApiClient/YulsnApiClient.csproj | head -1)
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in YulsnApiClient.csproj. Bump the csproj or move the tag."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches <Version>$version</Version>."

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore YulsnApiClient.sln

      - name: Build
        run: dotnet build YulsnApiClient.sln --configuration Release --no-restore

      - name: Pack
        run: dotnet pack YulsnApiClient/YulsnApiClient.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./artifacts

      - name: Push to nuget.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
